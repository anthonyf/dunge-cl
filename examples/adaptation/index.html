#dunge-scene-title {

#dunge-scene-body {
  font-size: 1.1rem;
}
#dunge-scene-body p {
  margin: 0 0 1rem;

#dunge-choices {

  gap: 10px;
  margin-top: 32px;
}
.dunge-choice {

  padding: 10px 14px;

  background: #fffaf0;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.dunge-choice:hover,
.dunge-choice:focus {

  outline: 2px solid transparent;
  background: #fffdf8;
}
.dunge-quit {

}
#dunge-controls {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 24px;
}
#dunge-new-game,
#dunge-undo {
  min-height: 36px;
  padding: 6px 10px;
  border: 1px solid #6f6a5f;
  border-radius: 6px;
  color: inherit;
  background: transparent;
  font: inherit;
  cursor: pointer;
}
#dunge-new-game:hover,
#dunge-new-game:focus,
#dunge-undo:hover,
#dunge-undo:focus {
  border-color: #211f1c;
  outline: 2px solid transparent;
  background: #fffaf0;
}
#dunge-undo:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
@media (prefers-color-scheme: dark) {
  body { color: #f4efe5; background: #181713; }
  .dunge-choice {
    border-color: #80776a;
    background: #25221c;
  }
  .dunge-choice:hover,
  .dunge-choice:focus {
    border-color: #f4efe5;
    background: #302c24;
  }
  #dunge-new-game:hover,
  #dunge-new-game:focus,
  #dunge-undo:hover,
  #dunge-undo:focus { border-color: #f4efe5; background: #25221c; }
  .dunge-quit { color: #bbb3a6; }
