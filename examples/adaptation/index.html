<!doctype html>
<html lang='en'><head><meta charset='utf-8' /><meta name='viewport' content='width=device-width, initial-scale=1' /><title>Dunge Adaptation Testbed</title><style>*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
  line-height: 1.55;
  color: #211f1c;
  background: #f7f4ed;
}
#dunge-app {
  width: min(760px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 48px 0;
}
#dunge-scene { min-width: 0; }
#dunge-scene-title {
  margin: 0 0 24px;
  font-size: clamp(2rem, 7vw, 3.75rem);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: 0;
}
#dunge-scene-body {
  font-size: 1.1rem;
}
#dunge-scene-body p {
  margin: 0 0 1rem;
}
.dunge-message {
  margin: 0 0 1rem;
  padding-left: 1rem;
  border-left: 3px solid #8f6a3a;
  font-style: italic;
}
#dunge-choices {
  display: grid;
  gap: 10px;
  margin-top: 32px;
}
.dunge-choice {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid #6f6a5f;
  border-radius: 6px;
  color: inherit;
  background: #fffaf0;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.dunge-choice:hover,
.dunge-choice:focus {
  border-color: #211f1c;
  outline: 2px solid transparent;
  background: #fffdf8;
}
.dunge-quit {
  color: #666056;
}
#dunge-controls {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 24px;
}
#dunge-new-game,
#dunge-undo {
  min-height: 36px;
  padding: 6px 10px;
  border: 1px solid #6f6a5f;
  border-radius: 6px;
  color: inherit;
  background: transparent;
  font: inherit;
  cursor: pointer;
}
#dunge-new-game:hover,
#dunge-new-game:focus,
#dunge-undo:hover,
#dunge-undo:focus {
  border-color: #211f1c;
  outline: 2px solid transparent;
  background: #fffaf0;
}
#dunge-undo:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
@media (prefers-color-scheme: dark) {
  body { color: #f4efe5; background: #181713; }
  .dunge-choice {
    border-color: #80776a;
    background: #25221c;
  }
  .dunge-choice:hover,
  .dunge-choice:focus {
    border-color: #f4efe5;
    background: #302c24;
  }
  #dunge-new-game:hover,
  #dunge-new-game:focus,
  #dunge-undo:hover,
  #dunge-undo:focus { border-color: #f4efe5; background: #25221c; }
  .dunge-quit { color: #bbb3a6; }
