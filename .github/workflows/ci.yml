name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Build web export
        run: sbcl --non-interactive --load web-export.lisp

      - name: Build web tests
        run: sbcl --non-interactive --eval '(push :web-test *features*)' --load web-export.lisp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run web tests
        run: npx playwright test

      - name: Deploy to GitHub Pages (dev)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
