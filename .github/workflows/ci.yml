name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Capture SBCL version
        id: sbcl
        run: |
          version="$(sbcl --version)"
          echo "version=${version// /-}" >> "$GITHUB_OUTPUT"

      - name: Install ocicl
        run: |
          curl -fsSL https://ocicl.github.io/ocicl/deb-repo/ocicl-archive-keyring.gpg |
            sudo tee /usr/share/keyrings/ocicl-archive-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/ocicl-archive-keyring.asc] https://ocicl.github.io/ocicl/deb-repo stable main" |
            sudo tee /etc/apt/sources.list.d/ocicl.list
          sudo apt-get update
          sudo apt-get install --yes ocicl
          ocicl setup >> ~/.sbclrc

      - name: Cache Lisp dependencies
        uses: actions/cache@v4
        with:
          path: |
            ocicl
            ~/.cache/common-lisp
          key: ${{ runner.os }}-${{ steps.sbcl.outputs.version }}-${{ hashFiles('ocicl.csv') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.sbcl.outputs.version }}-

      - name: Install dependencies
        run: ocicl install

      - name: Run tests
        run: |
          sbcl --non-interactive --eval '(asdf:test-system :dunge/tests)'
          sbcl --non-interactive --eval '(asdf:test-system :dunge-styles/tests)'

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Pages directory
        run: |
          rm -rf public
          mkdir -p public
          cp .github/pages/index.html public/index.html
          find . -mindepth 2 -name index.html \
            ! -path './.*/*' \
            ! -path './public/*' \
            -print0 |
          while IFS= read -r -d '' page; do
            target="public/$(dirname "${page#./}")"
            mkdir -p "$target"
            cp "$page" "$target/index.html"
          done
          touch public/.nojekyll

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: ${GITHUB_SHA}"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
