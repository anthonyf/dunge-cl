name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install binaryen (from GitHub releases — Ubuntu's binaryen is too old for WASM GC)
        run: |
          BINARYEN_VERSION=version_129
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C /tmp
          sudo cp /tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-* /usr/local/bin/
          wasm-as --version

      - name: Install qlot
        run: |
          export QLOT_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$QLOT_BIN_DIR"
          curl -L https://qlot.tech/installer | QLOT_BIN_DIR="$QLOT_BIN_DIR" bash
          echo "$QLOT_BIN_DIR" >> $GITHUB_PATH

      - name: Install ECE
        run: |
          git clone --depth 1 https://github.com/anthonyf/ece.git /tmp/ece
          cd /tmp/ece
          qlot install
          make install PREFIX=$HOME/.local
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Run tests
        run: ece tests/run-all.scm

      - name: Build web export
        run: scripts/build-web.sh
