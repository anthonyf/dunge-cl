name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Install Qlot
        run: |
          curl --location https://qlot.tech/installer | sh
          echo "$HOME/.qlot/bin" >> "$GITHUB_PATH"

      - name: Cache Lisp dependencies
        uses: actions/cache@v4
        with:
          path: |
            .qlot
            ~/.cache/common-lisp
          key: ${{ runner.os }}-sbcl-${{ hashFiles('qlfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-sbcl-

      - name: Install dependencies
        run: qlot install

      - name: Run tests
        run: qlot exec sbcl --non-interactive --eval '(asdf:test-system :dunge/tests)'
