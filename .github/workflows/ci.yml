name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Capture SBCL version
        id: sbcl
        run: |
          version="$(sbcl --version)"
          echo "version=${version// /-}" >> "$GITHUB_OUTPUT"

      - name: Install ocicl
        run: |
          curl -fsSL https://ocicl.github.io/ocicl/deb-repo/ocicl-archive-keyring.gpg |
            sudo tee /usr/share/keyrings/ocicl-archive-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/ocicl-archive-keyring.asc] https://ocicl.github.io/ocicl/deb-repo stable main" |
            sudo tee /etc/apt/sources.list.d/ocicl.list
          sudo apt-get update
          sudo apt-get install --yes ocicl
          ocicl setup >> ~/.sbclrc

      - name: Cache Lisp dependencies
        uses: actions/cache@v4
        with:
          path: |
            ocicl
            ~/.cache/common-lisp
          key: ${{ runner.os }}-${{ steps.sbcl.outputs.version }}-${{ hashFiles('ocicl.csv') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.sbcl.outputs.version }}-

      - name: Install dependencies
        run: ocicl install

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        env:
          DUNGE_REQUIRE_NODE: "1"
        run: |
          sbcl --non-interactive --eval '(asdf:test-system :dunge/tests)'
          sbcl --non-interactive --eval '(asdf:test-system :dunge-styles/tests)'

      - name: Build and check Pages site
        run: sh site/check.sh public

      - name: Upload Pages site
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: public
          include-hidden-files: true
          if-no-files-found: error

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Download Pages site
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: public

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: ${GITHUB_SHA}"
          git branch -M gh-pages
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
