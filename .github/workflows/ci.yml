name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Setup ECE dependency
        run: |
          ECE_REF="11e8e04fc6b107860a9769b3baefcc5c5489e2be"
          mkdir -p .qlot
          git clone https://github.com/anthonyf/ece.git .qlot/ece-src
          cd .qlot/ece-src && git checkout "$ECE_REF" && cd ../..
          cat > .qlot/setup.lisp <<'EOF'
          (require :asdf)
          (push (merge-pathnames "ece-src/"
                  (make-pathname :name nil :type nil :defaults *load-truename*))
                asdf:*central-registry*)
          EOF

      - name: Run ECE tests
        run: sbcl --non-interactive --load run-tests.lisp

      - name: Build web export
        run: sbcl --non-interactive --load web-export.lisp
