name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (needed to build ECE from source)
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install ECE
        run: |
          git clone --depth 1 https://github.com/anthonyf/ece.git /tmp/ece
          cd /tmp/ece
          make install
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Run tests
        run: ece tests/run-all.scm

      - name: Build web export
        run: scripts/build-web.sh
