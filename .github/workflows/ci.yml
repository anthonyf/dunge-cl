name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install --yes sbcl

      - name: Capture SBCL version
        id: sbcl
        run: |
          version="$(sbcl --version)"
          echo "version=${version// /-}" >> "$GITHUB_OUTPUT"

      - name: Install Qlot
        env:
          QLOT_INSTALLER_URL: https://github.com/fukamachi/qlot/releases/download/1.8.3/qlot-installer-1.8.3.sh
          QLOT_INSTALLER_SHA256: 8b8bb87c35600f05f38b71fb07309dfef9fb846592dee151cc92c8c294971e66
        run: |
          installer="$(mktemp)"
          checksum_file="$(mktemp)"
          curl --fail --silent --show-error --location "$QLOT_INSTALLER_URL" --output "$installer"
          echo "$QLOT_INSTALLER_SHA256  $installer" > "$checksum_file"
          sha256sum --check "$checksum_file"
          sh "$installer"
          echo "$HOME/.qlot/bin" >> "$GITHUB_PATH"

      - name: Cache Lisp dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/common-lisp
          key: ${{ runner.os }}-${{ steps.sbcl.outputs.version }}-${{ hashFiles('qlfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.sbcl.outputs.version }}-

      - name: Install dependencies
        run: qlot install

      - name: Run tests
        run: qlot exec sbcl --non-interactive --eval '(asdf:test-system :dunge/tests)'
