name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute ECE submodule SHA
        id: ece-sha
        run: echo "sha=$(git -C vendor/ece rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache built ECE
        uses: actions/cache@v4
        with:
          path: |
            vendor/ece/bin
            vendor/ece/share
            vendor/ece/.qlot
            vendor/ece/.fasl-cache
          key: ece-${{ runner.os }}-${{ steps.ece-sha.outputs.sha }}

      # SBCL, qlot, and binaryen below are required to build the ECE
      # submodule on cache miss; they are not runtime dependencies of Dunge.
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install binaryen (from GitHub releases — Ubuntu's binaryen is too old for WASM GC)
        run: |
          BINARYEN_VERSION=version_129
          curl -sL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C /tmp
          sudo cp /tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-* /usr/local/bin/
          wasm-as --version

      - name: Install qlot
        run: |
          export QLOT_BIN_DIR="$HOME/.local/bin"
          mkdir -p "$QLOT_BIN_DIR"
          curl -L https://qlot.tech/installer | QLOT_BIN_DIR="$QLOT_BIN_DIR" bash
          echo "$QLOT_BIN_DIR" >> $GITHUB_PATH

      - name: Run tests
        run: make test

      - name: Build web export
        env:
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: make build

      - name: Deploy to GitHub Pages (prod)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
