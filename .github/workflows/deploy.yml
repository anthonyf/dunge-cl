name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (needed to build ECE from source)
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install ECE
        run: |
          git clone --depth 1 https://github.com/anthonyf/ece.git /tmp/ece
          cd /tmp/ece
          make install
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Run tests
        run: ece tests/run-all.scm

      - name: Build web export
        env:
          COMMIT_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}
        run: scripts/build-web.sh

      - name: Deploy to GitHub Pages (prod)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
