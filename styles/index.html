<!doctype html>
<html lang='en'><head><meta charset='utf-8' /><meta name='viewport' content='width=device-width, initial-scale=1' /><title>The Mysterious Affair at Styles</title><style>*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light dark; }

}

}

}

.dunge-choice:focus {

  background: #fffdf8;
}

}

  .dunge-choice:focus {

    background: #302c24;
  }
  .dunge-quit { color: #bbb3a6; }
}</style><script>window.DUNGE_GAME_DATA = {"version":1,"start":"station","state":{"keys":["seen-station-intro","seen-road-intro","fact-john-invited-hastings","fact-emily-married-alfred","fact-household-dislikes-alfred","clue-evie-warning","clue-cynthia-dispensary","clue-mary-poison-talk","event-emily-dies","clue-locked-bedroom","clue-broken-bell","clue-cynthia-deep-sleep","clue-charred-will-fragment","clue-broken-coffee-cup","clue-cocoa-saucepan","clue-medicine-contained-strychnine","clue-purple-despatch-case","clue-dorcas-heard-quarrel","clue-fire-in-hot-weather","clue-missing-coffee-cup","clue-chemist-strychnine-sale","clue-alfred-alibi-sale-time","clue-evelyn-could-impersonate-alfred","clue-bromide-powders","clue-strychnine-bitter","clue-final-dose-danger","clue-incriminating-letter","deduction-poison-in-medicine","deduction-chemist-purchase-staged","deduction-alfred-wanted-arrest","deduction-alfred-evelyn-conspiracy","fact-hastings-on-leave"],"values":{"seen-station-intro":null,"seen-road-intro":null,"fact-john-invited-hastings":null,"fact-emily-married-alfred":null,"fact-household-dislikes-alfred":null,"clue-evie-warning":null,"clue-cynthia-dispensary":null,"clue-mary-poison-talk":null,"event-emily-dies":null,"clue-locked-bedroom":null,"clue-broken-bell":null,"clue-cynthia-deep-sleep":null,"clue-charred-will-fragment":null,"clue-broken-coffee-cup":null,"clue-cocoa-saucepan":null,"clue-medicine-contained-strychnine":null,"clue-purple-despatch-case":null,"clue-dorcas-heard-quarrel":null,"clue-fire-in-hot-weather":null,"clue-missing-coffee-cup":null,"clue-chemist-strychnine-sale":null,"clue-alfred-alibi-sale-time":null,"clue-evelyn-could-impersonate-alfred":null,"clue-bromide-powders":null,"clue-strychnine-bitter":null,"clue-final-dose-danger":null,"clue-incriminating-letter":null,"deduction-poison-in-medicine":null,"deduction-chemist-purchase-staged":null,"deduction-alfred-wanted-arrest":null,"deduction-alfred-evelyn-conspiracy":null,"fact-hastings-on-leave":true}},"rooms":[{"type":"room","id":"station","title":"Styles St. Mary Station","body":[{"type":"branch","condition":{"type":"not","condition":{"type":"state","scope":"global","role":null,"key":"seen-station-intro"}},"then":[{"type":"p","text":"You are Captain Arthur Hastings, invalided home from the Front after months in a convalescent home. A month of sick leave should be a blessing, but with no near family and no settled plan, it has mostly left you wondering where a wounded soldier belongs."},{"type":"p","text":"Three days ago you ran across John Cavendish, an old acquaintance from boyhood visits to Styles Court. The talk went back to old times, then forward to an invitation: come down to Essex, spend your leave at Styles, and let the quiet country do what doctors and institutional soup could not."},{"type":"p","text":"Now the train has set you down at Styles St. Mary, a little station stranded among green fields and lanes. John waits on the platform beside a motor car, older than you remember, friendly as ever, and not quite able to hide the strain in his household."}],"else":[{"type":"p","text":"John remains beside the motor car, patient but restless, while the little station sits behind you in the afternoon quiet."}]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"fact-john-invited-hastings"},"then":[{"type":"p","text":"John's invitation no longer feels merely hospitable. There is tension at Styles, and he is glad to have an old friend near enough to notice it."}],"else":[]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"fact-emily-married-alfred"},"then":[{"type":"p","text":"Mrs. Inglethorp's new marriage already sounds less like romance than a problem everyone else is forced to live with."}],"else":[]},{"type":"choice","label":"Tell John how little plan you have for leave","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-station-intro"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"John says, \"Styles is the very place for you, Hastings. Quiet rooms, green walks, and old memories enough to make you feel at home before we arrive.\""}}]},"id":"styles-hastings-leave","once":true,"condition":null},{"type":"choice","label":"Ask John why he wanted you at Styles","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-station-intro"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"fact-john-invited-hastings"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"My mother will be delighted to see you,\" John says quickly. \"We are all delighted, of course.\" He turns to the car with a haste that makes the invitation feel less casual than it sounded in London."}}]},"id":"styles-john-invitation","once":true,"condition":null},{"type":"choice","label":"Ask about Mrs. Inglethorp's new husband","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-station-intro"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"fact-emily-married-alfred"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"fact-household-dislikes-alfred"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"Alfred Inglethorp came as my mother's secretary and stayed as her husband,\" John says. \"You may imagine how well we liked the transformation.\" His anger is too immediate to be only snobbery."}}]},"id":"styles-ask-about-alfred","once":true,"condition":null},{"type":"choice","label":"Set out for Styles Court","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-station-intro"},"value":{"type":"literal","value":true}},{"type":"goto","room":{"type":"literal","value":"village-road"}}]},"id":null,"once":null,"condition":null}]},{"type":"room","id":"village-road","title":"Road to Styles Court","body":[{"type":"branch","condition":{"type":"not","condition":{"type":"state","scope":"global","role":null,"key":"seen-road-intro"}},"then":[{"type":"p","text":"John pilots the motor away from the station, through the village, and out toward Styles Court. The road runs past flat Essex fields bright under the July sun, peaceful enough to make the war feel indecently far away."},{"type":"p","text":"The quiet does not last. \"We do our bit,\" John says, speaking of volunteer drills, farms short of hands, and Mary rising early to work on the land. Somehow every ordinary arrangement at Styles still seems to lead back to Alfred Inglethorp."}],"else":[{"type":"p","text":"The motor carries you closer to Styles Court while John keeps one eye on the road and the other on everything he has not quite said."}]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"fact-household-dislikes-alfred"},"then":[{"type":"p","text":"What John said at the station settles into a clearer shape: Alfred is not merely disliked. He has changed the air of the house."}],"else":[]},{"type":"choice","label":"Ask about Emily Inglethorp's place in the house","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-road-intro"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"fact-john-invited-hastings"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"My mother is generosity itself,\" John says, \"and energy itself too. Styles is hers in money, in habit, and in command. We all move where she places us.\""}}]},"id":"styles-road-emily","once":true,"condition":null},{"type":"choice","label":"Ask how the family bears Alfred","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-road-intro"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"fact-emily-married-alfred"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"fact-household-dislikes-alfred"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"John gives a short laugh without amusement. \"Alfred is useful to my mother, unwelcome to the rest of us, and somehow always present where money, letters, and influence are concerned.\""}}]},"id":"styles-road-alfred","once":true,"condition":null},{"type":"choice","label":"Let the car carry you into Styles","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"seen-road-intro"},"value":{"type":"literal","value":true}},{"type":"goto","room":{"type":"literal","value":"tea-table"}}]},"id":null,"once":null,"condition":null}]},{"type":"room","id":"tea-table","title":"Lawn and Tea Table","body":[{"type":"p","text":"The motor turns in at the lodge gates and the old house comes into view. Before tea, John introduces you to Evelyn Howard in the garden: blunt, sunburnt, vigorous. \"If you mean to be useful at Styles, Captain Hastings, keep your eyes open and your mouth shut,\" she says."},{"type":"p","text":"She leads you round the house to the lawn, where tea is laid under a wide tree. Mary Cavendish rises from a basket chair with a stillness that catches you off guard; Emily Inglethorp presides kindly but completely; Alfred hovers near her; Cynthia comes bright from hospital work; Evelyn watches Alfred with open contempt."},{"type":"p","text":"You are still only a guest, but the household has begun arranging itself before you like evidence: old affection, new marriage, money, dependence, charm, resentment, and a politeness too thin to hide the cracks."},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"clue-evie-warning"},"then":[{"type":"p","text":"Evelyn's warning hangs in the air: \"That man is dangerous.\" It was blunt enough to seem honest."}],"else":[]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"clue-cynthia-dispensary"},"then":[{"type":"p","text":"Cynthia's dispensary work gives her brightness a sharper edge: she handles medicines every day."}],"else":[]},{"type":"choice","label":"Ask Evelyn why she distrusts Alfred","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-evie-warning"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"Because he is a dangerous man,\" Evelyn says. \"Look at him with Mrs. Inglethorp, Mr. Hastings, and tell me I am wrong if you dare.\""}}]},"id":"styles-ask-evelyn","once":true,"condition":null},{"type":"choice","label":"Ask Cynthia about the dispensary","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-cynthia-dispensary"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"Oh, we are tremendously scientific at the dispensary,\" Cynthia says, laughing. \"Bromides, strychnine, bottles with skulls on them. Enough to make one quite important.\" The names come easily to her."}}]},"id":"styles-ask-cynthia-tea","once":true,"condition":null},{"type":"choice","label":"Ask Mary about poisons","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-mary-poison-talk"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"Poisons are rather fascinating, are they not?\" Mary says lightly. Then her eyes meet yours. \"You look shocked, Captain Hastings. I promise I am only being idle.\""}}]},"id":"styles-ask-mary-poisons","once":true,"condition":null},{"type":"choice","label":"Retire for the night","target":{"type":"goto","room":{"type":"literal","value":"night-crisis"}},"id":null,"once":null,"condition":null}]},{"type":"room","id":"night-crisis","title":"Landing Outside Emily's Room","body":[{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"event-emily-dies"},"then":[{"type":"p","text":"The door has been forced. The house whispers around the fact of Emily Inglethorp's death."}],"else":[{"type":"p","text":"A cry tears through the corridor. Emily's bedroom door is locked from within, and the household gathers in panic."}]},{"type":"branch","condition":{"type":"not","condition":{"type":"state","scope":"global","role":null,"key":"event-emily-dies"}},"then":[{"type":"choice","label":"Force Emily's door","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"event-emily-dies"},"value":{"type":"literal","value":true}},{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-locked-bedroom"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"The lock gives. Emily is beyond help."}}]},"id":"styles-force-door","once":true,"condition":null}],"else":[]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"event-emily-dies"},"then":[{"type":"choice","label":"Inspect the broken bell","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-broken-bell"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"The bell could not have summoned help. Someone made sure of that."}}]},"id":"styles-inspect-bell","once":true,"condition":null},{"type":"choice","label":"Check Cynthia's room","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-cynthia-deep-sleep"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"Cynthia slept through a crisis she should have heard."}}]},"id":"styles-check-cynthia-room","once":true,"condition":null},{"type":"choice","label":"Enter Emily's bedroom","target":{"type":"goto","room":{"type":"literal","value":"bedroom"}},"id":null,"once":null,"condition":null}],"else":[]}]},{"type":"room","id":"bedroom","title":"Mrs. Inglethorp's Bedroom","body":[{"type":"p","text":"The bedroom is disordered by panic: a fallen table, traces of late-night drinks, a locked purple case, a cold grate, and too many people claiming to have noticed too little."},{"type":"choice","label":"Inspect the grate","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-charred-will-fragment"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"A charred scrap suggests a document was burned here."}}]},"id":"styles-inspect-grate","once":true,"condition":null},{"type":"choice","label":"Inspect the coffee remains","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-broken-coffee-cup"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"The broken cup draws the eye too neatly."}}]},"id":"styles-inspect-coffee","once":true,"condition":null},{"type":"choice","label":"Inspect the cocoa saucepan","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-cocoa-saucepan"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"The cocoa is present, suspicious, and perhaps too convenient."}}]},"id":"styles-inspect-cocoa","once":true,"condition":null},{"type":"choice","label":"Inspect the medicine bottle","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-medicine-contained-strychnine"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"The medicine is not innocent. Its contents point toward strychnine."}}]},"id":"styles-inspect-medicine","once":true,"condition":null},{"type":"choice","label":"Inspect the purple despatch-case","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-purple-despatch-case"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"Emily kept important papers in the purple despatch-case."}}]},"id":"styles-inspect-case","once":true,"condition":null},{"type":"choice","label":"Question the servants","target":{"type":"goto","room":{"type":"literal","value":"servants-hall"}},"id":null,"once":null,"condition":null},{"type":"choice","label":"Take the evidence to Poirot","target":{"type":"goto","room":{"type":"literal","value":"poirot"}},"id":null,"once":null,"condition":null}]},{"type":"room","id":"servants-hall","title":"Servants' Hall","body":[{"type":"p","text":"The servants' hall has its own map of Styles: trays, keys, fires, bells, errands, and the tones of voices behind closed doors."},{"type":"choice","label":"Ask Dorcas about the quarrel","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-dorcas-heard-quarrel"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"Dorcas heard more anger than the family cares to admit."}}]},"id":"styles-dorcas-quarrel","once":true,"condition":null},{"type":"choice","label":"Ask about Emily's fire","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-fire-in-hot-weather"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"Emily ordered a fire on a day too warm for one."}}]},"id":"styles-dorcas-fire","once":true,"condition":null},{"type":"choice","label":"Ask about the coffee and cocoa tray","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"clue-missing-coffee-cup"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"The tray details do not quite match the room."}}]},"id":"styles-dorcas-tray","once":true,"condition":null},{"type":"choice","label":"Return to Poirot","target":{"type":"goto","room":{"type":"literal","value":"poirot"}},"id":null,"once":null,"condition":null}]},{"type":"room","id":"poirot","title":"Poirot's Lodging","body":[{"type":"p","text":"Poirot's room is small, exact, and impossibly neat. \"No, my friend,\" he says when you press him. \"I do not give you the answer. I give you the little road by which you may arrive.\""},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"deduction-poison-in-medicine"},"then":[{"type":"p","text":"The medicine method is now fixed in your notebook."}],"else":[]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"deduction-chemist-purchase-staged"},"then":[{"type":"p","text":"The chemist purchase no longer looks like proof. It looks like theatre."}],"else":[]},{"type":"branch","condition":{"type":"state","scope":"global","role":null,"key":"deduction-alfred-evelyn-conspiracy"},"then":[{"type":"p","text":"Alfred and Evelyn finally stand together in the pattern of facts."}],"else":[]},{"type":"choice","label":"Open the suspect board","target":{"type":"goto","room":{"type":"literal","value":"suspect-board"}},"id":null,"once":null,"condition":null},{"type":"choice","label":"Visit the village chemist","target":{"type":"goto","room":{"type":"literal","value":"chemist"}},"id":null,"once":null,"condition":null},{"type":"choice","label":"Visit the dispensary","target":{"type":"goto","room":{"type":"literal","value":"dispensary"}},"id":null,"once":null,"condition":null},{"type":"branch","condition":{"type":"and","conditions":[{"type":"state","scope":"global","role":null,"key":"clue-medicine-contained-strychnine"},{"type":"state","scope":"global","role":null,"key":"clue-bromide-powders"},{"type":"state","scope":"global","role":null,"key":"clue-final-dose-danger"},{"type":"not","condition":{"type":"state","scope":"global","role":null,"key":"deduction-poison-in-medicine"}}]},"then":[{"type":"choice","label":"Tell Poirot the medicine was the vehicle","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"deduction-poison-in-medicine"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"\"Precisely, Hastings.\" Poirot nods. \"The fatal dose was prepared before the final cup was ever poured. The poison waited. That is the terrible neatness of it.\""}}]},"id":"styles-deduce-medicine","once":true,"condition":null}],"else":[]},{"type":"branch","condition":{"type":"and","conditions":[{"type":"state","scope":"global","role":null,"key":"clue-chemist-strychnine-sale"},{"type":"state","scope":"global","role":null,"key":"clue-alfred-alibi-sale-time"},{"type":"state","scope":"global","role":null,"key":"clue-evelyn-could-impersonate-alfred"},{"type":"not","condition":{"type":"state","scope":"global","role":null,"key":"deduction-chemist-purchase-staged"}}]},"then":[{"type":"choice","label":"Tell Poirot the chemist purchase was staged","target":{"type":"sequence","effects":[{"type":"set","target":{"type":"state","scope":"global","role":null,"key":"deduction-chemist-purchase-staged"},"value":{"type":"literal","value":true}},{"type":"say","text":{"type":"literal","value":"Poirot smiles. \"The purchase was arranged to be found. A clue too obliging, my friend, is sometimes not a clue but an invitation.\""}}]},"id":"styles-deduce-staged-purchase","once
